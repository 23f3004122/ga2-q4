<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Quiz Lobby - Office Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

<div class="w-full max-w-3xl p-8 bg-slate-800 rounded-2xl shadow-lg space-y-6">

    <!-- Header -->
    <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-indigo-400">Fun Quiz Lobby</h2>
        <a href="/logout" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg font-semibold transition-transform transform hover:scale-105">
            Logout
        </a>
    </div>

    <!-- Game Code Section -->
    <div class="bg-slate-700 p-4 rounded-lg">
        <h3 class="text-lg font-semibold text-indigo-300">Game Code</h3>
        <p class="text-white text-2xl font-bold mt-2">{{ game_code }}</p>
        <p class="text-slate-400 mt-1 text-sm">Share this code with friends to join your game.</p>
    </div>

    <!-- Joined Players -->
    <div class="bg-slate-700 p-4 rounded-lg">
        <h3 class="text-lg font-semibold text-indigo-300">Players Joined</h3>
        <ul class="mt-2 list-disc list-inside">
            {% for player in players %}
                <li>{{ player.user.username }}</li>
            {% else %}
                <li class="text-slate-400">No players joined yet.</li>
            {% endfor %}
        </ul>
    </div>

    <!-- Start Quiz Button -->
    <div class="pt-4">
        <a href="/fun/start" class="w-full block text-center py-3 px-4 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-white font-semibold transition-transform transform hover:scale-105">
            Start Quiz
        </a>
    </div>

</div>

</body>
</html>
