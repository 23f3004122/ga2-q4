<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Office Quiz Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">

<div class="w-full max-w-md p-8 space-y-6 bg-slate-800 rounded-2xl shadow-lg">

    <h1 class="text-3xl font-bold text-indigo-400 text-center">Login</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 p-3 bg-red-600 text-white rounded-lg">
          {% for msg in messages %}
            <p>{{ msg }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST" class="space-y-4 mt-4">
        <input 
            type="email" 
            name="email" 
            placeholder="Email" 
            required
            class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        
        <input 
            type="password" 
            name="password" 
            placeholder="Password" 
            required
            class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        
        <button type="submit" 
                class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-white font-semibold transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">
            Login
        </button>
    </form>

    <p class="mt-4 text-center text-slate-400">
        Don't have an account? 
        <a href="/register" class="text-indigo-400 hover:underline">Register here</a>
    </p>

</div>

</body>
</html>
