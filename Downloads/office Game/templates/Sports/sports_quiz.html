<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Quiz - Office Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white flex justify-center py-10">

<div class="w-full max-w-3xl p-8 bg-slate-800 rounded-2xl shadow-lg space-y-6">

    <h1 class="text-3xl font-bold text-indigo-400 text-center">Sports Quiz</h1>

    <form method="POST">
        {% for q in questions %}
        <div class="bg-slate-700 p-4 rounded-lg space-y-2">
            <p class="font-semibold text-lg">{{ loop.index }}. {{ q.question_text }}</p>

            <div class="flex flex-col space-y-2 mt-2">
                <label>
                    <input type="radio" name="question_{{ q.id }}" value="A" class="mr-2">
                    {{ q.option_a }}
                </label>
                <label>
                    <input type="radio" name="question_{{ q.id }}" value="B" class="mr-2">
                    {{ q.option_b }}
                </label>
                <label>
                    <input type="radio" name="question_{{ q.id }}" value="C" class="mr-2">
                    {{ q.option_c }}
                </label>
                <label>
                    <input type="radio" name="question_{{ q.id }}" value="D" class="mr-2">
                    {{ q.option_d }}
                </label>
            </div>
        </div>
        {% endfor %}

        <div class="pt-6">
            <button type="submit" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 rounded-lg font-semibold transition-transform transform hover:scale-105">
                Submit Answers
            </button>
        </div>
    </form>

</div>

</body>
</html>
